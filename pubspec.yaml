name: smart_university_services
description: "دليل الخدمات الجامعية الذكي — تطبيق فلاتر لإدارة الإجراءات والخدمات الجامعية لجميع الأدوار (طالب، دكتور، شؤون طلاب، إدارة)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # لرسم الأيقونات بنفس مسارات SVG الأصلية من تصميم Figma
  path_drawing: ^1.0.1
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/image.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/image.png
  windows:
    generate: true
    image_path: assets/image.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/image.png
